name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu runners ship the Android SDK (ANDROID_HOME); AGP fetches any missing platform itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests (export format must match the browser extension byte for byte)
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest 2>&1 | tee test.log; s=${PIPESTATUS[0]}
          grep -E "^e: |error:|FAILED|What went wrong|expected:|but was:" -A2 test.log | head -60 | sed 's/^/::error::/'
          exit $s

      - name: Build APK
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee build.log; s=${PIPESTATUS[0]}
          grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -60 | sed 's/^/::error::/'
          exit $s

      - name: Name the APK
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "TExporT-android-$v.apk"
          echo "APK=TExporT-android-$v.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: TExporT-android-apk
          path: ${{ env.APK }}

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "TExporT for Android $GITHUB_REF_NAME" --notes "Install the APK on your phone (allow installs from your browser or file manager when asked)."
