name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu runners ship the Android SDK (ANDROID_HOME); AGP fetches any missing platform itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests (export format must match the browser extension byte for byte)
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest 2>&1 | tee test.log; s=${PIPESTATUS[0]}
          grep -E "^e: |error:|FAILED|What went wrong|expected:|but was:" -A2 test.log | head -60 | sed 's/^/::error::/'
          exit $s

      - name: Build APK
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee build.log; s=${PIPESTATUS[0]}
          grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -60 | sed 's/^/::error::/'
          exit $s

      - name: Name the APK
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "TExporT-android-$v.apk"
          echo "APK=TExporT-android-$v.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: TExporT-android-apk
          path: ${{ env.APK }}

      - name: Publish the APK as a GitHub release (main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$v" > /dev/null 2>&1; then
            gh release upload "v$v" "$APK" --clobber
          else
            gh release create "v$v" "$APK" --target "$GITHUB_SHA" --title "TExporT for Android v$v" \
              --notes "Download the APK on your phone and open it to install (allow installs from your browser when asked). See CHANGELOG.md."
          fi
